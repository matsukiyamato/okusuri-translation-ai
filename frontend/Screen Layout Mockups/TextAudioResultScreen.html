<!DOCTYPE html>

<style>
        body {
            font-family: 'Atkinson Hyperlegible Next', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .audio-wave-anim {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 16px;
        }
        .audio-wave-anim div {
            width: 3px;
            background: currentColor;
            border-radius: 1px;
            animation: wave 1s infinite ease-in-out;
        }
        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
        .wave-1 { animation-delay: 0s !important; }
        .wave-2 { animation-delay: 0.2s !important; }
        .wave-3 { animation-delay: 0.4s !important; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col pb-40">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-on-background shadow-sm flex items-center justify-between px-margin-mobile h-touch-target-critical w-full">
<button class="material-symbols-outlined text-primary dark:text-primary-fixed hover:bg-surface-variant transition-colors active:scale-95 duration-100 p-2 rounded-full">arrow_back</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed truncate">お薬翻訳AI</h1>
<button class="material-symbols-outlined text-primary dark:text-primary-fixed hover:bg-surface-variant transition-colors active:scale-95 duration-100 p-2 rounded-full">account_circle</button>
</header>
<!-- Main Content Canvas -->
<main class="mt-20 px-margin-mobile flex-grow">
<!-- Large Medicine Title Card -->
<div class="mb-section-gap">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-on-background leading-tight mb-2">
                ロキソプロフェンナトリウム
            </h2>
<div class="flex items-center gap-2 text-primary font-label-md">
<span class="material-symbols-outlined text-[18px]">verified</span>
<span>AIによる高精度翻訳済み</span>
</div>
</div>
<!-- Audio Controller Floating Bar -->
<section class="bg-primary-container text-on-primary-container rounded-xl p-4 shadow-lg mb-section-gap flex flex-col gap-3">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="bg-primary text-on-primary w-12 h-12 rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform cursor-pointer" onclick="togglePlayback()">
<span class="material-symbols-outlined text-[32px]" id="play-pause-icon">pause</span>
</div>
<div>
<p class="font-label-lg text-white">自動音声読み上げ中...</p>
<div class="audio-wave-anim text-white/60 mt-1">
<div class="wave-1"></div>
<div class="wave-2"></div>
<div class="wave-3"></div>
<div class="wave-2"></div>
<div class="wave-1"></div>
</div>
</div>
</div>
<div class="flex gap-2">
<button class="material-symbols-outlined p-2 rounded-full hover:bg-white/10">volume_up</button>
<button class="material-symbols-outlined p-2 rounded-full hover:bg-white/10">settings</button>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden">
<div class="bg-white h-full w-1/3 rounded-full"></div>
</div>
</section>
<!-- Translation Body -->
<article class="bg-surface-container-lowest rounded-xl border border-outline-variant p-gutter space-y-8 shadow-sm">
<section>
<h3 class="flex items-center gap-2 font-label-lg text-primary mb-2">
<span class="material-symbols-outlined">info</span>
                    【ききめ（効果）】
                </h3>
<p class="font-body-lg text-body-lg leading-[1.3] text-on-surface">
                    いたみ や 熱を おさえる お薬です。
                </p>
</section>
<section>
<h3 class="flex items-center gap-2 font-label-lg text-primary mb-2">
<span class="material-symbols-outlined">schedule</span>
                    【のみかた（用法）】
                </h3>
<p class="font-body-lg text-body-lg leading-[1.3] text-on-surface">
                    1日に 3回、ご飯を 食べたあとに のんでください。
                </p>
</section>
<!-- Decorative Image for Context -->
<div class="mt-4 rounded-lg overflow-hidden">
<img class="w-full h-32 object-cover" data-alt="A clean, minimalist close-up shot of medical tablet blisters on a soft teal and white surface. The lighting is high-key and professional, evoking a modern pharmaceutical lab aesthetic. The composition uses shallow depth of field to focus on the textures of the packaging, maintaining a clinical yet approachable and calm atmosphere consistent with medical safety and reliability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCgGLC8_Em7ubdmcG17f5uw9hTQTrvOB78ABbqcIhlun4S-Depz-3ECqYWl7_cxXIwzvoTbZRgKSiDwgzXMYFVL8lwaJ8Q5cT8cOx-AvEREgf3_UMXAhe48ISxyE1GAHNqWQYVZydTCku-8A2fezW50Qvh60eWy8Pl1zMVD4IgVc5spmQtMZO1sHSd0oS4uHK_0IK4rLpIUBt4uxzoiW-P7ajjHoqyTiDGHAJre7SWxBgu--ZcRleWp"/>
</div>
<footer class="pt-4 border-t border-outline-variant">
<p class="text-label-md text-on-surface-variant italic">
                    出典：PMDA（医薬品医療機器総合機構）公的データ
                </p>
</footer>
</article>
<!-- Related Tips / Quick Actions Bento -->
<div class="grid grid-cols-2 gap-element-gap mt-section-gap">
<div class="bg-secondary-container p-4 rounded-xl flex flex-col justify-between aspect-square">
<span class="material-symbols-outlined text-on-secondary-container">warning</span>
<p class="font-label-md text-on-secondary-container">注意点を確認する</p>
</div>
<div class="bg-surface-container-high p-4 rounded-xl flex flex-col justify-between aspect-square">
<span class="material-symbols-outlined text-primary">history</span>
<p class="font-label-md text-on-surface">過去の履歴と比較</p>
</div>
</div>
</main>
<!-- Bottom persistent Interaction Area -->
<nav class="fixed bottom-0 left-0 w-full bg-surface dark:bg-on-background z-50 px-margin-mobile pt-4 pb-8 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] border-t border-outline-variant">
<div class="flex items-center gap-2 bg-surface-container-high rounded-full px-4 py-2 h-touch-target-critical border-2 border-transparent focus-within:border-primary transition-all">
<input class="flex-grow bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder:text-on-surface-variant" placeholder="このお薬について追加で質問する" type="text"/>
<button class="bg-primary text-on-primary w-10 h-10 rounded-full flex items-center justify-center hover:bg-secondary transition-colors active:scale-90">
<span class="material-symbols-outlined">mic</span>
</button>
</div>
<!-- Standard Nav Items suppressed for focused task, but kept as subtle indicators if needed.
             Based on 'Manual Suppression' rule, we use a minimal task-focused footer. -->
<div class="flex justify-around mt-4">
<div class="flex flex-col items-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">translate</span>
<span class="text-[10px] font-bold">翻訳</span>
</div>
<div class="flex flex-col items-center text-on-surface-variant opacity-40">
<span class="material-symbols-outlined">history</span>
<span class="text-[10px]">履歴</span>
</div>
<div class="flex flex-col items-center text-on-surface-variant opacity-40">
<span class="material-symbols-outlined">sign_language</span>
<span class="text-[10px]">手話</span>
</div>
<div class="flex flex-col items-center text-on-surface-variant opacity-40">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px]">設定</span>
</div>
</div>
</nav>
<script>
        let isPlaying = true;
        function togglePlayback() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('play-pause-icon');
            const statusText = document.querySelector('.font-label-lg');
            const waves = document.querySelector('.audio-wave-anim');
            
            if (isPlaying) {
                icon.innerText = 'pause';
                statusText.innerText = '自動音声読み上げ中...';
                waves.style.opacity = '1';
            } else {
                icon.innerText = 'play_arrow';
                statusText.innerText = '読み上げ停止中';
                waves.style.opacity = '0.3';
            }
        }
    </script>
</body></html>
