<style>
        body {

            -webkit-tap-highlight-color: transparent;
        }

<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar (Based on Shared Components) -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm flex items-center justify-between px-margin-mobile h-touch-target-critical border-none">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-variant transition-colors rounded-full active:scale-95 duration-100 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary">お薬翻訳AI</h1>
</div>
<button class="p-2 hover:bg-surface-variant transition-colors rounded-full active:scale-95 duration-100 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="account_circle">account_circle</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-touch-target-critical pb-12 px-margin-mobile flex flex-col items-center justify-center">
<div class="w-full max-w-md bg-surface-container-low rounded-xl p-8 border border-outline-variant shadow-sm mt-8">
<!-- Header Section -->
<div class="mb-8 text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">パスワードの追加設定</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                    安全なログインのために、パスワードを設定してください。
                </p>
</div>
<!-- Form -->
<form class="space-y-6" id="password-setup-form">
<!-- Email Field (Read-only) -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="mail">mail</span>
                        メールアドレス
                    </label>
<div class="flex items-center h-touch-target-min bg-surface-dim px-4 rounded-lg border border-outline text-on-surface-variant font-body-md opacity-70">
                        user@gmail.com
                    </div>
<p class="text-[12px] text-tertiary-container mt-1">※ Googleアカウントに紐づいたアドレスです</p>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-sm" data-icon="lock">lock</span>
                        新しいパスワード
                    </label>
<div class="relative group">
<input class="w-full h-touch-target-min bg-surface px-4 py-2 rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-0 outline-none transition-all font-body-md" id="password" oninput="validateForm()" placeholder="新しいパスワードを入力" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword('password')" type="button">
<span class="material-symbols-outlined" id="eye-password">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-2" for="confirm-password">
<span class="material-symbols-outlined text-sm" data-icon="verified_user">verified_user</span>
                        パスワード（再入力）
                    </label>
<div class="relative group">
<input class="w-full h-touch-target-min bg-surface px-4 py-2 rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-0 outline-none transition-all font-body-md" id="confirm-password" oninput="validateForm()" placeholder="パスワード（再入力）" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword('confirm-password')" type="button">
<span class="material-symbols-outlined" id="eye-confirm">visibility</span>
</button>
</div>
<p class="text-error text-[14px] h-5 mt-1 transition-opacity opacity-0" id="error-text">パスワードが一致しません</p>
</div>
<!-- Password Requirements Card -->
<div class="bg-surface-variant p-4 rounded-lg space-y-2">
<p class="font-label-md text-label-md text-primary mb-2">パスワードの要件:</p>
<div class="flex items-center gap-2 text-label-md transition-colors" id="req-length">
<span class="material-symbols-outlined text-xs" data-icon="check_circle">check_circle</span>
                        8文字以上
                    </div>
<div class="flex items-center gap-2 text-label-md transition-colors" id="req-match">
<span class="material-symbols-outlined text-xs" data-icon="check_circle">check_circle</span>
                        再入力と一致
                    </div>
</div>
<!-- Action Button -->
<button class="w-full h-touch-target-critical rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 transition-all shadow-sm cursor-not-allowed active:scale-[0.98] bg-primary text-on-primary" disabled="" id="submit-btn" type="submit">
                    設定を完了して進む
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Visual Hint -->
<div class="mt-12 opacity-40 grayscale pointer-events-none">
<div class="w-32 h-1 bg-primary rounded-full mb-2 mx-auto" data-alt="A clean, minimalist medical laboratory environment with soft teal lighting and high-tech digital displays. The atmosphere is clinical, sterile, and professional, echoing a sense of security and trust in healthcare technology. Modern geometric patterns are subtly visible in the background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBx1_hJXUFQLRbJVoMC3SGPW94NNNia_MB6n5kcR6Lf7Ol42ttsZewwvLiaiwf3ghXa7jWkyHVvFZtwlk65n41yGWYvriag_4uWnCWvSFEHTFC2P0Pxk2GNsNsavVlFN6xcDOtMWnijg6a84JK-guGbyrictX8kkcOM9TMtmEQWLJ49H7DEdZcBjczjdASZOVEfyqW1m5lB6ythA3S4bCFCR-1bBeerAzumUGRR0ACzNWyCTeIYJyez')"></div>
<p class="text-label-md text-center">Medical Grade Security &amp; AI Precision</p>
</div>
</main>
<!-- Bottom Navigation suppressed as per "The Destination Rule" for Transactional flow -->
<script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = document.getElementById(id === 'password' ? 'eye-password' : 'eye-confirm');
            if (input.type === "password") {
                input.type = "text";
                icon.innerText = "visibility_off";
            } else {
                input.type = "password";
                icon.innerText = "visibility";
            }
        }

        function validateForm() {
            const pwd = document.getElementById('password').value;
            const confirmPwd = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');
            const errorText = document.getElementById('error-text');
            const reqLength = document.getElementById('req-length');
            const reqMatch = document.getElementById('req-match');

            const isLongEnough = pwd.length >= 8;
            const isMatching = pwd === confirmPwd && pwd !== "";

            // UI Feedback for requirements
            if (isLongEnough) {
                reqLength.classList.add('text-primary');
                reqLength.classList.remove('text-on-surface-variant');
            } else {
                reqLength.classList.remove('text-primary');
                reqLength.classList.add('text-on-surface-variant');
            }

            if (isMatching) {
                reqMatch.classList.add('text-primary');
                reqMatch.classList.remove('text-on-surface-variant');
                errorText.classList.add('opacity-0');
            } else if (confirmPwd.length > 0) {
                reqMatch.classList.remove('text-primary');
                reqMatch.classList.add('text-on-surface-variant');
                errorText.classList.remove('opacity-0');
            }

            // Button State
            if (isLongEnough && isMatching) {
                btn.disabled = false;
                btn.classList.remove('bg-surface-variant', 'text-outline', 'cursor-not-allowed');
                btn.classList.add('bg-primary', 'text-white', 'hover:bg-opacity-90');
            } else {
                btn.disabled = true;
                btn.classList.add('bg-surface-variant', 'text-outline', 'cursor-not-allowed');
                btn.classList.remove('bg-primary', 'text-white', 'hover:bg-opacity-90');
            }
        }

        document.getElementById('password-setup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // Success animation or redirection logic would go here
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> 処理中...`;
            setTimeout(() => {
                alert('パスワードの設定が完了しました。');
                // window.location.href = '/home';
            }, 1000);
        });
    </script>
