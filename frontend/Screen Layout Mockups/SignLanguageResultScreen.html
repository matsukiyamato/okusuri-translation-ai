<!DOCTYPE html>

<html class="light" lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        /* Forcing the font mapping from config */
        body { font-family: 'Atkinson Hyperlegible Next', sans-serif; }

<style>
    body {

    }

  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col pb-[160px]">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-on-background shadow-sm flex items-center justify-between px-margin-mobile h-touch-target-critical w-full">
<div class="flex items-center gap-4">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center hover:bg-surface-variant transition-colors rounded-full active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed">お薬翻訳AI</h1>
</div>
<div class="flex items-center gap-2">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center hover:bg-surface-variant transition-colors rounded-full active:scale-95 duration-100">

</button>
</div>
</header>
<!-- Main Content Area -->
<main class="mt-[56px] flex-grow w-full max-w-4xl mx-auto flex flex-col">
<!-- Header Section -->
<section class="px-margin-mobile py-4">
<div class="flex items-center gap-2 mb-1">

</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">ロキソプロフェンナトリウム</h2>
</section>
<!-- Video Viewport (16:9) -->

<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A professional sign language interpreter, a Japanese woman in her 40s wearing a clean dark professional top, communicating in Japanese Sign Language with clear, expressive facial expressions and hand movements. The background is a soft, solid teal-grey medical clinical setting with gentle lighting to ensure maximum visibility of the hands. The overall aesthetic is calm, professional, and accessible. High-definition quality." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA3NoIQOQPZ5m8EwUdbXs-MT9EKyeQwQKunn1nSgSj6vCRqbXkWhcLNOOMlZzR6eJO4P26Een0m5_1rhVbOy1tUN5RC8qE17CDg5SYmQu4Nb_gi3zuYWr0BI3uPV-913N5J-W-JqzuqcZq0Up0jziQENrcyfvsvQzXWtna6IAwBF85XnAkRK0NOS9vQ3XgOlKPgEU-SjM3bm7h9j9CDSvl9gWJ1Po9i1REF7Jl-zG1jykjSl-wPaqv7')">
<!-- Video Controls Mockup -->
<div class="absolute top-4 right-4 z-10">
<div class="bg-black/40 backdrop-blur-md px-3 py-1 rounded-lg flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
<span class="text-white text-label-md font-label-md">LIVE INTERPRET</span>
</div>
</div>
<!-- Central Play Button (Hidden during simulation) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-20 h-20 bg-primary/80 rounded-full flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</div>
</div>
<!-- Video Overlay Gradient -->
<div class="absolute inset-0 video-gradient-overlay pointer-events-none"></div>
<!-- High-Contrast Captions -->
<div class="absolute bottom-6 left-0 w-full px-margin-mobile flex justify-center">
<div class="bg-black/90 border border-white/20 px-6 py-4 rounded-xl max-w-[90%] shadow-2xl">
<p class="text-white font-headline-md text-headline-md text-center leading-relaxed">
                            1日に3回、ご飯を食べた後に飲んでください。
                        </p>
</div>
</div>
</div>
</section>
<!-- Description Scroll View -->
<section class="px-margin-mobile py-section-gap space-y-element-gap">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<h3 class="font-label-lg text-label-lg text-secondary">やさしい日本語 (Easy Japanese)</h3>
</div>
<div class="easy-japanese-card bg-surface-container-low p-gutter rounded-xl shadow-sm">

<span class="bg-secondary-container/30 font-bold border-b-2 border-secondary">1日に 3回、ご飯を 食べたあと</span>に のんでください。
                </p>
</div>
<div class="mt-8 pt-4 border-t border-outline-variant">
<div class="flex items-center justify-between text-on-surface-variant font-label-md text-label-md">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span>ソース: 医療用医薬品 添付文書翻訳AI</span>
</div>
<button class="text-primary font-bold flex items-center gap-1">
<span class="material-symbols-outlined text-sm">info</span>
                        詳細
                    </button>
</div>
</div>
</section>
</main>
<!-- Bottom Persistent Interaction Panel -->
<div class="fixed bottom-0 left-0 w-full z-40">
<!-- Floating Interaction Bar -->

<div class="bg-surface-container-highest p-3 rounded-2xl shadow-xl flex items-center gap-3 border border-outline-variant">
<div class="flex-grow flex items-center bg-surface px-4 py-3 rounded-xl border border-outline">

</div>
</div>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-[80px] pb-safe bg-surface dark:bg-on-background rounded-t-xl shadow-lg border-t border-outline-variant">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:bg-surface-bright transition-colors" href="#">
<span class="material-symbols-outlined">translate</span>
<span class="font-label-lg text-label-lg">翻訳</span>
</a>

<span class="material-symbols-outlined">history</span>
<span class="font-label-lg text-label-lg">履歴</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-container text-on-secondary-container dark:text-secondary-container rounded-full px-6 py-2" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sign_language</span>
<span class="font-label-lg text-label-lg">手話</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:bg-surface-bright transition-colors" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-lg text-label-lg">設定</span>
</a>
</nav>
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.querySelector('.mic-pulse');
            let isListening = false;

            micBtn.addEventListener('click', () => {
                isListening = !isListening;
                if(isListening) {
                    micBtn.classList.remove('bg-primary');
                    micBtn.classList.add('bg-error');
                    micBtn.innerHTML = '<span class="material-symbols-outlined text-3xl" style="font-variation-settings: \'FILL\' 1;">stop</span>';
                    console.log('Voice interaction started...');
                } else {
                    micBtn.classList.remove('bg-error');
                    micBtn.classList.add('bg-primary');
                    micBtn.innerHTML = '<span class="material-symbols-outlined text-3xl" style="font-variation-settings: \'FILL\' 1;">mic</span>';
                    console.log('Voice interaction ended.');
                }
            });
        });
    </script>
</body></html>
