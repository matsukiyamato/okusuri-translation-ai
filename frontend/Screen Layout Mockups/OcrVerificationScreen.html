<style>

            font-family: 'Atkinson Hyperlegible Next', sans-serif;

            width: 4px;

<body class="h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm flex items-center justify-between px-margin-mobile h-touch-target-critical w-full">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center hover:bg-surface-variant transition-colors active:scale-95 duration-100 rounded-full">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary">内容の確認</h1>
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center hover:bg-surface-variant transition-colors active:scale-95 duration-100 rounded-full">
<span class="material-symbols-outlined text-primary">help</span>
</button>
</header>
<main class="flex-grow flex flex-col pt-touch-target-critical pb-[100px]">
<!-- Top Component (35% height): Static Preview -->
<section class="h-[309px] w-full relative overflow-hidden bg-on-background">
<div class="absolute inset-0 opacity-80" data-alt="A high-resolution, close-up photograph of a medical prescription paper with Japanese text. The lighting is bright and even, highlighting the texture of the paper and the sharp black ink of the characters. The composition is a top-down crop showing specific medicine names. The overall aesthetic is professional, clean, and clinical, using a soft teal and white color palette for consistency with the medical UI." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBB7dIOwyB-Gugc-tC0cwL3WVQBGeJ7dSZ9EdUs3xDdLupWlzII_SMwGTlJBNeQdGZPu6FQsEl2oNdbhR-UHIutPMO8maPLiHOJdx3CehpoNYRKOyIbpWZ2AvXX4hPLRI5z49EgNGi07cqoUxM9MlSNsvhqaEDGH7si2PGOScSJ2RIpZKZ_IUV5UdKoCGJSnf8FdAeg9M0ii6ma-yR2sfCbpKNiHo9QmfhZ8RVUYWFGRm-BaUKCuYgx')">
</div>
<!-- OCR Scan Overlay Effect -->
<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
<div class="border-2 border-primary-fixed w-3/4 h-1/2 rounded-lg relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-0.5 bg-primary-fixed shadow-[0_0_15px_#97f3e2] animate-[scan_3s_ease-in-out_infinite]"></div>
</div>
</div>
<div class="absolute bottom-4 left-4 bg-black/60 text-white text-label-md px-3 py-1 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">photo_camera</span>
                撮影された画像
            </div>
</section>
<!-- Bottom Component (65% height): Editable Form -->
<section class="flex-grow bg-surface overflow-y-auto custom-scrollbar px-margin-mobile pt-8 pb-12">
<div class="max-w-md mx-auto space-y-8">
<div class="space-y-2">
<p class="text-on-surface-variant font-label-lg flex items-center gap-2">
<span class="material-symbols-outlined text-primary">description</span>
                        読み取り結果
                    </p>
<p class="text-body-md text-on-surface-variant">
                        文字が間違っている場合は、枠内をタップして修正してください。
                    </p>
</div>
<!-- Input Field 1: Medicine Name -->
<div class="space-y-3">
<label class="block font-headline-md text-headline-md text-on-surface" for="medicine-name">
                        お薬名 (Medicine Name)
                    </label>
<div class="relative focus-ring rounded-lg">
<input class="w-full h-touch-target-critical px-4 bg-surface-container-low border-b-2 border-outline font-body-lg text-body-lg text-on-surface focus:border-primary transition-colors rounded-t-lg" id="medicine-name" type="text" value="ロキソプロフェンナトリウム"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-outline">edit</span>
</div>
</div>
</div>
<!-- Input Field 2: Dosage -->
<div class="space-y-3">
<label class="block font-headline-md text-headline-md text-on-surface" for="dosage">
                        用法・用量 (Dosage)
                    </label>
<div class="relative focus-ring rounded-lg">
<textarea class="w-full p-4 bg-surface-container-low border-b-2 border-outline font-body-lg text-body-lg text-on-surface focus:border-primary transition-colors rounded-t-lg resize-none" id="dosage" rows="2">1回1錠、1日3回 食後</textarea>
<div class="absolute right-4 top-4">
<span class="material-symbols-outlined text-outline">edit</span>
</div>
</div>
</div>
<!-- Warning/Note -->
<div class="p-4 bg-error-container rounded-xl flex gap-4">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
<div>
<p class="text-on-error-container font-label-lg">確認のお願い</p>
<p class="text-on-error-container text-label-md mt-1 leading-relaxed">
                            AIの読み取りは100%正確ではありません。必ず実際のお薬の袋や説明書と比較してください。
                        </p>
</div>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Actions (Sticky row) -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-highest/90 backdrop-blur-md px-margin-mobile py-4 z-50 border-t border-outline-variant">
<div class="flex items-center justify-between max-w-md mx-auto h-touch-target-critical">

<span class="font-label-lg">再撮影</span>
</button>
<!-- Right Solid Button (45% width) -->
<button class="w-[45%] h-touch-target-critical bg-primary text-on-primary font-bold rounded-full flex items-center justify-center gap-2 shadow-md hover:brightness-110 active:scale-95 transition-all">
<span class="material-symbols-outlined">check_circle</span>
<span class="font-label-lg">決定</span>
</button>
</div>
</footer>
<style>
        @keyframes scan {
            0%, 100% { top: 0; }
            50% { top: 100%; }
        }
    </style>
<script>
        // Simple micro-interaction for input focus
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('bg-white');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('bg-white');
            });
        });

        // Prevention of accidental zoom on mobile focus
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body></html>
