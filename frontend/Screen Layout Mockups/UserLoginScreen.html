<style>
        body {
            font-family: 'Atkinson Hyperlegible Next', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(209, 219, 219, 0.5);
        }

    body {

<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center overflow-x-hidden">
<!-- Atmospheric Background Element -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-secondary-container opacity-20 blur-[120px]"></div>
<div class="absolute top-[40%] -right-[15%] w-[70%] h-[70%] rounded-full bg-primary-fixed-dim opacity-15 blur-[150px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-md px-margin-mobile flex flex-col items-center gap-section-gap py-12">
<!-- Header Branding (Suppressed Nav Shell as per transactional rule) -->
<div class="w-full text-center mb-4">
<div class="flex items-center justify-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: &quot;FILL&quot; 1;">medical_services</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">お薬翻訳AI</h1>
</div>
<p class="font-body-md text-on-surface-variant max-w-[280px] mx-auto">正確な医療情報を、あなたの言語で。安全な医療体験を提供します。</p>
</div>
<!-- Login Card -->
<div class="w-full glass-panel rounded-xl shadow-sm p-gutter flex flex-col gap-6">
<h2 class="font-headline-md text-headline-md text-on-surface">ログイン</h2>
<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-on-surface-variant ml-1" for="email">メールアドレス</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline">mail</span>
<input class="w-full h-touch-target-critical pl-12 pr-4 bg-surface-container-low border-b-2 border-outline rounded-t-lg focus:border-primary focus:ring-0 transition-all font-body-md text-on-surface placeholder:text-outline-variant" id="email" placeholder="メールアドレス" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-on-surface-variant ml-1" for="password">パスワード</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline">lock</span>
<input class="w-full h-touch-target-critical pl-12 pr-12 bg-surface-container-low border-b-2 border-outline rounded-t-lg focus:border-primary focus:ring-0 transition-all font-body-md text-on-surface placeholder:text-outline-variant" id="password" placeholder="パスワード" type="password">
<button class="absolute right-2 w-touch-target-min h-touch-target-min flex items-center justify-center text-outline-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility</span>
</button>
</div>
<div class="text-right">
<a class="font-label-md text-secondary hover:underline" href="#">パスワードを忘れた場合</a>
</div>
</div>
<!-- Primary Action -->
<button class="mt-2 w-full h-touch-target-critical bg-primary text-on-primary rounded-full font-label-lg text-label-lg shadow-sm active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">login</span>
<span class="">ログインする</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label-md text-outline">または</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<!-- Social Action -->
<button class="w-full h-touch-target-critical bg-surface-container-lowest border border-outline-variant rounded-full flex items-center justify-center gap-3 active:bg-surface-variant transition-all font-label-lg text-label-lg text-on-surface"><img alt="Google" class="w-6 h-6" src="https://www.gstatic.com/images/branding/product/2x/googleg_48dp.png"><span class="">Googleアカウントでログイン</span></button>
</div>
<!-- Footer Navigation -->
<div class="flex flex-col items-center gap-4 mt-4">
<a class="font-label-lg text-label-lg text-secondary hover:text-primary underline underline-offset-4 transition-colors" href="#">
                新しくアカウントを作る（新規登録画面へ）
            </a>
<div class="w-full h-16 rounded-xl bg-surface-container-low p-4 flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: &quot;FILL&quot; 1;">security</span>
<p class="font-label-md text-on-surface-variant">あなたのデータは医療レベルの暗号化で保護されます</p>
</div>
</div>
<!-- Abstract Decorative Illustration Area -->
<div class="mt-8 w-full h-48 rounded-2xl overflow-hidden relative shadow-sm border border-outline-variant">
<div class="w-full h-full bg-cover bg-center" data-alt="A clinical yet warm medical illustration of a generic medication bottle and a smartphone displaying a glowing translation wave. The style is modern corporate flat art with high contrast using the teal and white palette. The lighting is soft and bright, suggesting a safe, professional pharmaceutical environment with abstract molecular shapes floating in the background." style="background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuDxnNW2uzIRuk67FMdjJEHq9NihoYzDHEA8no-NwFjF0mh77mk2a6d_mOJRB7eRLq-vyPmxHf-HsZFK9ipWSt0hMJisTGlFb4YVWbiThDFoiliQCvssWSQuCPoCzeGd3Qf1DICVTZHNGn40YJptq2zO1HPNLkJlp1OxyMMeyPJaJBlQGeX1j-Yg8pWbpGL_DkykzdG48liAKZQBxw-6UP0PxWuiKmPoGtv-YnzrszQmkGMOdb_Duo6c&quot;);"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background/40 to-transparent"></div>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        // Add subtle focus animation for inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
                input.parentElement.parentElement.style.transition = 'all 0.2s ease-out';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>


</body></html>
