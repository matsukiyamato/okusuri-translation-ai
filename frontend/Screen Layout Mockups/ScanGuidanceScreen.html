<!DOCTYPE html>

<html class="light" lang="ja"><head>
<meta charset="utf-8"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        .instruction-card {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .instruction-card:active {
            transform: scale(0.98);
        }

        .scanning-animation {
            position: relative;
            overflow: hidden;
        }
        .scanning-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to bottom, transparent, #00796b, transparent);
            animation: scan 3s linear infinite;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Safe Area Padding */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Bar (Hidden on Guidance as per Contextual Suppression) -->
<!-- However, providing a minimal header as requested for the Title -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm h-touch-target-critical flex items-center px-margin-mobile">
<button aria-label="Back" class="material-symbols-outlined text-primary p-2 active:scale-95 duration-100">
            arrow_back
        </button>
<h1 class="ml-4 font-headline-md text-headline-md text-on-surface truncate">撮影をはじめる前の確認</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-20 pb-32 px-margin-mobile max-w-lg mx-auto w-full">
<!-- Instructional area with GIF/Animation Placeholder -->
<section class="mb-section-gap">
<div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden bg-surface-container-high border border-outline-variant flex items-center justify-center scanning-animation">
<div class="scanning-line"></div>
<!-- Instructional Image -->
<img class="w-4/5 h-auto object-contain z-10" data-alt="A clean, medical-themed digital illustration demonstrating how to align a prescription document within a blue square frame on a smartphone screen. The lighting is soft and clinical, using the brand's teal and soft grey palette. The background is a bright white surface, emphasizing accessibility and clarity for a healthcare app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDP7ZY6RnvjDnWTBrmd-m9hfbL5fxrUmYaN5LJGRqcGiOxqsLixpKQS3grMk3CY-K15Y9acZ23-C6hlE20XvcXUdtgJjx7ZZ1xkxNC_Fk2x2XolTfCzjJOcgwY8XSV_CX3hxTXPKzF0tZPNUF4Eed0g3QlIRl5WPa8BJpeMD85hXSeThIQrW4nSnkvesJqp5tfmq5ISnIWoJ4VAJ9TqgfBTzoVKFmdqICwP0-1pzwrO8WZ3W_jE7jVO"/>
<!-- Overlay Frame Bracket Indicators -->
<div class="absolute inset-8 border-2 border-primary/40 rounded-lg pointer-events-none">
<div class="absolute -top-1 -left-1 w-6 h-6 border-t-4 border-l-4 border-primary"></div>
<div class="absolute -top-1 -right-1 w-6 h-6 border-t-4 border-r-4 border-primary"></div>
<div class="absolute -bottom-1 -left-1 w-6 h-6 border-b-4 border-l-4 border-primary"></div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 border-b-4 border-r-4 border-primary"></div>
</div>
</div>
</section>
<!-- Instructional List -->
<div class="space-y-gutter">
<!-- Item 1 -->
<div class="instruction-card flex items-start p-gutter bg-surface-container-low rounded-xl border border-outline-variant/30 shadow-sm">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container mr-4">
<span class="material-symbols-outlined text-[28px]">light_mode</span>
</div>
<div>
<h2 class="font-label-lg text-label-lg text-on-surface mb-1">明るい場所で撮影してください</h2>
<p class="text-on-surface-variant font-body-md text-sm">文字がはっきり読めるよう、十分な光がある場所でスキャンを開始します。</p>
</div>
</div>
<!-- Item 2 -->
<div class="instruction-card flex items-start p-gutter bg-surface-container-low rounded-xl border border-outline-variant/30 shadow-sm">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container mr-4">
<span class="material-symbols-outlined text-[28px]">crop_free</span>
</div>
<div>
<h2 class="font-label-lg text-label-lg text-on-surface mb-1">お薬の説明書を、カメラの青い枠の中に合わせてください</h2>
<p class="text-on-surface-variant font-body-md text-sm">カメラを平行に保ち、文書全体が枠内に収まるようにしてください。</p>
</div>
</div>
<!-- Tip / Warning Chip -->
<div class="flex items-center gap-2 p-3 bg-[#fff9eb] border border-[#ffe0a3] rounded-lg text-on-surface-variant">
<span class="material-symbols-outlined text-amber-600">info</span>
<p class="text-sm font-label-md">影が入らないように注意してください</p>
</div>
</div>
</main>
<!-- Bottom Action Bar (Contextual Primary Button) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md px-margin-mobile pt-4 pb-safe border-t border-outline-variant/20 z-40">
<div class="max-w-lg mx-auto pb-6">
<button class="w-full h-touch-target-critical bg-primary text-on-primary font-label-lg text-label-lg rounded-full shadow-lg hover:bg-surface-tint active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-weight="fill">photo_camera</span>
                カメラを起動する
            </button>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.querySelector('button');
            btn.addEventListener('click', () => {
                // Add a small feedback ripple or transition
                console.log('Starting Camera...');
            });

            // Prevent scroll bounce on iOS
            document.body.addEventListener('touchmove', function(e) {
                if (e.target.closest('main')) return;
                // e.preventDefault();
            }, { passive: false });
        });
    </script>
</body></html>
