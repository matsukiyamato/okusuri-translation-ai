<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center overflow-x-hidden selection:bg-secondary-container">
<!-- Top Navigation Bar (Logo Only for Registration) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md flex items-center justify-center px-margin-mobile h-touch-target-critical shadow-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: &quot;FILL&quot; 1;">medical_services</span>
<span class="text-headline-md font-headline-md font-bold text-primary">お薬翻訳AI</span>
</div>
</header>
<main class="w-full max-w-md px-margin-mobile pt-32 pb-12 flex flex-col animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Header Content -->
<section class="mb-section-gap">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">アカウント新規登録</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                安心してお薬を服用するために、アカウントを作成しましょう。
            </p>
</section>
<!-- Main Registration Form -->
<form class="flex flex-col gap-6" onsubmit="return false;">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="email">メールアドレス</label>
<div class="relative group">
<input class="w-full h-touch-target-critical px-4 bg-surface-container-low border-b-2 border-outline focus:border-primary focus:ring-0 transition-all font-body-md text-body-md rounded-t-lg" id="email" placeholder="メールアドレスを入力" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="password">パスワード</label>
<div class="relative group">
<input class="w-full h-touch-target-critical pl-4 pr-12 bg-surface-container-low border-b-2 border-outline focus:border-primary focus:ring-0 transition-all font-body-md text-body-md rounded-t-lg" id="password" placeholder="パスワードを入力 (英大文字・小文字・数字・記号を含む8文字以上)" required="" type="password">
<button aria-label="パスワードの表示を切り替える" class="absolute right-2 top-1/2 -translate-y-1/2 w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- CTA Primary Action -->
<button class="mt-4 h-touch-target-critical bg-primary-container text-on-primary-container font-label-lg text-label-lg rounded-full shadow-sm hover:shadow-md active:scale-95 transition-all flex items-center justify-center gap-2 group" type="submit">
                登録する
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-section-gap">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label-md text-label-md text-outline">または</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<!-- Social Auth -->
<div class="flex flex-col gap-4">
<button class="h-touch-target-critical w-full flex items-center justify-center gap-3 bg-surface-container-lowest border border-outline-variant rounded-full font-label-lg text-label-lg text-on-surface hover:bg-surface-variant transition-colors active:scale-95">

<!-- Micro-interactions Script -->
<script>
        // Password Visibility Toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Simple button haptic feedback simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.classList.add('opacity-80');
            });
            btn.addEventListener('touchend', function() {
                this.classList.remove('opacity-80');
            });
        });

        // Form focus visual enhancements
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
                input.parentElement.parentElement.style.transition = 'all 0.2s ease-out';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
