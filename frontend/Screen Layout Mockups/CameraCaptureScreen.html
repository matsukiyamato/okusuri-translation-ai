<style>
        body {
            font-family: 'Atkinson Hyperlegible Next', sans-serif;
            background-color: #000;
            overflow: hidden;
            margin: 0;
            height: 100vh;
        }

        .camera-overlay {
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        .viewport-hole {
            background: transparent;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            position: relative;
        }

        .viewport-hole::before, .viewport-hole::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #7ad7c6; /* primary-fixed-dim */
            border-style: solid;
            pointer-events: none;
        }
        /* Corner Accents */
        .viewport-corner-tl { position: absolute; top: -2px; left: -2px; width: 40px; height: 40px; border-top: 4px solid #97f3e2; border-left: 4px solid #97f3e2; border-radius: 12px 0 0 0; }
        .viewport-corner-tr { position: absolute; top: -2px; right: -2px; width: 40px; height: 40px; border-top: 4px solid #97f3e2; border-right: 4px solid #97f3e2; border-radius: 0 12px 0 0; }
        .viewport-corner-bl { position: absolute; bottom: -2px; left: -2px; width: 40px; height: 40px; border-bottom: 4px solid #97f3e2; border-left: 4px solid #97f3e2; border-radius: 0 0 0 12px; }
        .viewport-corner-br { position: absolute; bottom: -2px; right: -2px; width: 40px; height: 40px; border-bottom: 4px solid #97f3e2; border-right: 4px solid #97f3e2; border-radius: 0 0 12px 0; }

        .shutter-ring {
            width: 80px;
            height: 80px;
            border: 4px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        .shutter-ring:active {
            transform: scale(0.92);
        }
        .shutter-center {
            width: 64px;
            height: 64px;
            background-color: white;
            border: 2px solid #005e53; /* primary */
            border-radius: 50%;
        }

        .drop-shadow-text {
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
        }

        .scanning-line {
            height: 2px;
            background: linear-gradient(to right, transparent, #97f3e2, transparent);
            width: 100%;
            position: absolute;
            animation: scan 3s linear infinite;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>

<div class="absolute inset-0 bg-white z-[100] opacity-0 pointer-events-none transition-opacity duration-100" id="capture-flash" style="opacity: 0;"></div>
<script>
        // Micro-interactions for the UI
        const shutter = document.querySelector('.shutter-ring');
        const flashOverlay = document.getElementById('capture-flash');
        const flashToggle = document.getElementById('flash-toggle');

        shutter.addEventListener('click', () => {
            // Visual feedback for capture
            flashOverlay.style.opacity = '1';
            setTimeout(() => {
                flashOverlay.style.opacity = '0';
            }, 100);

            // Optional: Haptic feedback simulation if supported
            if (window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        });

        let flashOn = false;
        flashToggle.addEventListener('click', () => {
            flashOn = !flashOn;
            const icon = flashToggle.querySelector('.material-symbols-outlined');
            if (flashOn) {
                icon.textContent = 'flash_on';
                icon.classList.add('text-primary-fixed');
                flashToggle.classList.add('bg-primary/40');
            } else {
                icon.textContent = 'flash_off';
                icon.classList.remove('text-primary-fixed');
                flashToggle.classList.remove('bg-primary/40');
            }
        });

        // Close button logic (simple demo)
        document.querySelector('header button:first-child').addEventListener('click', () => {
            console.log('Returning to main screen...');
        });
    </script>
