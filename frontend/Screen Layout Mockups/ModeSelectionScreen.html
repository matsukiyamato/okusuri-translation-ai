<!DOCTYPE html>

<html class="light" lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#005e53",
                    "tertiary": "#465655",
                    "surface": "#f6fafa",
                    "background": "#f6fafa",
                    "secondary-container": "#acedda",
                    "surface-container": "#ebefef",
                    "inverse-surface": "#2c3132",
                    "on-primary": "#ffffff",
                    "secondary": "#29695b",
                    "inverse-on-surface": "#edf1f1",
                    "on-error": "#ffffff",
                    "primary-fixed": "#97f3e2",
                    "tertiary-fixed": "#d4e6e5",
                    "error": "#ba1a1a",
                    "on-background": "#181c1d",
                    "on-primary-fixed-variant": "#005047",
                    "primary-fixed-dim": "#7ad7c6",
                    "surface-variant": "#dfe3e3",
                    "on-primary-fixed": "#00201b",
                    "on-tertiary-fixed": "#0e1e1e",
                    "outline-variant": "#bdc9c5",
                    "tertiary-container": "#5d6e6e",
                    "on-secondary-fixed": "#00201a",
                    "on-surface": "#181c1d",
                    "on-surface-variant": "#3e4946",
                    "secondary-fixed": "#afefdd",
                    "surface-container-lowest": "#ffffff",
                    "inverse-primary": "#7ad7c6",
                    "surface-dim": "#d7dbdb",
                    "on-tertiary-container": "#def0ef",
                    "on-secondary-container": "#2e6d5f",
                    "surface-container-high": "#e5e9e9",
                    "surface-container-low": "#f0f4f4",
                    "secondary-fixed-dim": "#94d3c1",
                    "outline": "#6e7a76",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed-variant": "#3a4a49",
                    "error-container": "#ffdad6",
                    "on-secondary-fixed-variant": "#065043",
                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "on-primary-container": "#a1feec",
                    "surface-container-highest": "#dfe3e3",
                    "surface-bright": "#f6fafa",
                    "tertiary-fixed-dim": "#b8cac9",
                    "primary-container": "#00796b",
                    "surface-tint": "#006b5e"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "touch-target-critical": "56px",
                    "section-gap": "24px",
                    "element-gap": "8px",
                    "gutter": "16px",
                    "touch-target-min": "48px",
                    "margin-mobile": "20px",
                    "margin-tablet": "32px"
            },
            "fontFamily": {
                    "label-lg": ["Atkinson Hyperlegible Next"],
                    "headline-md": ["Atkinson Hyperlegible Next"],
                    "body-lg": ["Atkinson Hyperlegible Next"],
                    "headline-lg-mobile": ["Atkinson Hyperlegible Next"],
                    "label-md": ["Atkinson Hyperlegible Next"],
                    "body-md": ["Atkinson Hyperlegible Next"],
                    "headline-lg": ["Atkinson Hyperlegible Next"]
            },
            "fontSize": {
                    "label-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.1px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-lg": ["20px", {"lineHeight": "30px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                    "body-md": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "0.25px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        
        body {
            font-family: 'Atkinson Hyperlegible Next', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .bento-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bento-card:active {
            transform: scale(0.97);
            background-color: var(--tw-bg-opacity, #acedda);
        }

        /* Reduced noise gradient for focus */
        .medical-gradient {
            background: linear-gradient(135deg, #f6fafa 0%, #ebefef 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-on-background shadow-sm flex items-center justify-between px-margin-mobile h-touch-target-critical">
<div class="flex items-center">
<button class="material-symbols-outlined text-primary dark:text-primary-fixed hover:bg-surface-variant transition-colors p-2 rounded-full active:scale-95 duration-100" data-icon="menu">menu</button>
</div>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed">お薬翻訳AI</h1>
<div class="flex items-center">
<button class="material-symbols-outlined text-primary dark:text-primary-fixed hover:bg-surface-variant transition-colors p-2 rounded-full active:scale-95 duration-100" data-icon="account_circle">account_circle</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] pb-[100px] px-margin-mobile flex flex-col max-w-lg mx-auto w-full">
<!-- Screen Title Section -->
<div class="mt-8 mb-10 text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">表示モードの選択</h2>
<p class="font-body-md text-body-md text-on-surface-variant">どちらの表示方法を希望しますか？</p>
</div>
<!-- Symmetrical Grid Layout -->
<div class="flex flex-col gap-6 flex-grow">
<!-- Card 1: Text & Audio -->
<button class="bento-card group flex flex-col items-center justify-center p-gutter bg-surface-container-low border border-outline-variant rounded-xl shadow-sm text-left w-full min-h-[220px] focus:outline-none focus:ring-4 focus:ring-primary/20">
<div class="flex gap-4 mb-4">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined text-4xl" data-icon="description">description</span>
</div>
<div class="w-16 h-16 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed">
<span class="material-symbols-outlined text-4xl" data-icon="volume_up">volume_up</span>
</div>
</div>
<div class="text-center w-full">
<h3 class="font-headline-md text-[20px] text-primary mb-3">テキスト・音声モード</h3>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed px-4">
                        お薬の説明を「やさしい日本語」の文字で表示し、自動で読み上げます。
                    </p>
</div>
</button>
<!-- Card 2: Sign Language Video -->
<button class="bento-card group flex flex-col items-center justify-center p-gutter bg-surface-container-low border border-outline-variant rounded-xl shadow-sm text-left w-full min-h-[220px] focus:outline-none focus:ring-4 focus:ring-primary/20">
<div class="flex gap-4 mb-4">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined text-4xl" data-icon="sign_language">sign_language</span>
</div>
<div class="w-16 h-16 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed">
<span class="material-symbols-outlined text-4xl" data-icon="play_circle">play_circle</span>
</div>
</div>
<div class="text-center w-full">
<h3 class="font-headline-md text-[20px] text-primary mb-3">手話動画モード</h3>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed px-4">
                        字幕付きの手話動画と音声でお薬の説明を再生します。
                    </p>
</div>
</button>
</div>
<!-- Decorative Illustration Placeholder (Atmospheric) -->
<div class="mt-auto pt-8 flex justify-center opacity-40">
<div class="w-32 h-1 bg-surface-variant rounded-full"></div>
</div>
</main>
<!-- BottomNavBar (Hidden on desktop via style guide responsive logic, but kept for mobile intent) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-[80px] pb-safe bg-surface dark:bg-on-background border-t border-outline-variant dark:border-outline z-50">
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-container text-on-secondary-container dark:text-secondary-container rounded-full px-6 py-2 touch-manipulation active:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined" data-icon="translate">translate</span>
<span class="font-label-lg text-label-lg">翻訳</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:bg-surface-bright dark:hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-lg text-label-lg">履歴</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:bg-surface-bright dark:hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="sign_language">sign_language</span>
<span class="font-label-lg text-label-lg">手話</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:bg-surface-bright dark:hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-lg text-label-lg">設定</span>
</button>
</nav>
<script>
        // Micro-interactions for cards
        document.querySelectorAll('.bento-card').forEach(card => {
            card.addEventListener('click', () => {
                // Subtle visual feedback
                card.classList.add('ring-4', 'ring-primary/40');
                setTimeout(() => {
                    card.classList.remove('ring-4', 'ring-primary/40');
                }, 400);
                
                // Logic for navigation would go here
                console.log('Selected Mode:', card.querySelector('h3').innerText);
            });
        });
    </script>
</body></html>
